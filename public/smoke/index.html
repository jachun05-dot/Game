<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08070c">
<title>사이버 흡연실</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="./firebase-config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap">
<style>
/* Layout: one full-bleed night room on canvas — neon sign, rainy window, a table with an ashtray. No interface beyond a mute toggle. */
:root {
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  --room: #08070c;
  --ink: #e9e4f2;
  --neon: #ff4fa3;
  --line: rgba(233, 228, 242, 0.18);
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; font: 14px system-ui, sans-serif; }
[hidden] { display: none !important; }
body { background: var(--room); color: var(--ink); overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#room { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#mute, .tool {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 14px);
  right: max(14px, env(safe-area-inset-right, 0px));
  width: 36px; height: 36px; border-radius: 50%;
  border: 1px solid var(--line); background: rgba(8, 7, 12, 0.35); color: var(--ink);
  display: grid; place-items: center; cursor: pointer; padding: 0; opacity: 0.6;
}
#mute:focus-visible, .tool:focus-visible { outline: 2px solid var(--neon); outline-offset: 2px; }
#mute svg, .tool svg { width: 18px; height: 18px; }
#mute .off, .tool .off { display: none; }
#micBtn { top: calc(env(safe-area-inset-top, 0px) + 58px); }
#voiceBtn { top: calc(env(safe-area-inset-top, 0px) + 102px); }
.tool[hidden] { display: none; }
#micBtn[aria-pressed="true"] { color: var(--neon); border-color: var(--neon); opacity: 1; box-shadow: 0 0 10px rgba(255, 79, 163, 0.5); }
#micBtn[aria-pressed="true"] .on, #voiceBtn[aria-pressed="true"] .on { display: none; }
#micBtn[aria-pressed="true"] .off, #voiceBtn[aria-pressed="true"] .off { display: block; }
#nick {
  position: fixed; inset: 0; display: grid; place-items: center; z-index: 5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: rgba(8, 7, 12, 0.55);
}
#nick[hidden] { display: none; }
.arrow {
  position: fixed; top: 63%; transform: translateY(-50%);
  width: 40px; height: 56px; border-radius: 12px; padding: 0; cursor: pointer;
  border: 1px solid var(--line); background: rgba(8, 7, 12, 0.35); color: var(--ink);
  display: grid; place-items: center; opacity: 0.7;
}
.arrow svg { width: 20px; height: 20px; }
.arrow.left { left: max(10px, env(safe-area-inset-left, 0px)); }
.arrow.right { right: max(10px, env(safe-area-inset-right, 0px)); }
.arrow:focus-visible { outline: 2px solid var(--neon); outline-offset: 2px; }
#tableLabel {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
  font: 15px "Do Hyeon", "Apple SD Gothic Neo", sans-serif; letter-spacing: 0.04em;
  color: var(--ink); opacity: 0.75; white-space: nowrap; pointer-events: none;
  font-variant-numeric: tabular-nums;
}
#tableLabel.warn { color: var(--neon); opacity: 1; }
.arrow[hidden] { display: none; }
#queue {
  position: fixed; inset: 0; display: grid; place-items: center; z-index: 4; text-align: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: rgba(8, 7, 12, 0.6);
  font-family: "Do Hyeon", "Apple SD Gothic Neo", sans-serif;
}
#queue[hidden] { display: none; }
#chat {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 3;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 48px);
  display: flex; gap: 6px; width: min(calc(100% - 32px), 300px);
}
#chat[hidden] { display: none; }
#chat input {
  flex: 1; min-width: 0; font: 16px "Do Hyeon", "Apple SD Gothic Neo", sans-serif; color: var(--ink);
  background: rgba(20, 16, 30, 0.7); border: 1px solid var(--line); border-radius: 999px; padding: 9px 14px;
  -webkit-user-select: text; user-select: text;
}
#chat input:focus { outline: none; border-color: var(--neon); }
#chat button {
  position: relative; overflow: hidden; flex: none; width: 64px;
  font: 15px "Do Hyeon", "Apple SD Gothic Neo", sans-serif; color: #08070c; background: var(--neon);
  border: 0; border-radius: 999px; cursor: pointer;
}
#chat button:disabled { background: rgba(255, 79, 163, 0.25); color: var(--ink); cursor: default; }
#chat button i { position: absolute; left: 0; bottom: 0; height: 3px; width: 0; background: var(--neon); }
#chat button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
#queue .card { display: flex; flex-direction: column; gap: 10px; align-items: center; }
#queue h2 { margin: 0; font-weight: 400; font-size: 26px; color: var(--neon); text-shadow: 0 0 14px rgba(255, 79, 163, 0.7); }
#queue .rank { font-size: 44px; color: var(--ink); font-variant-numeric: tabular-nums; }
#queue p { margin: 0; font-size: 15px; color: var(--ink); opacity: 0.7; }
#nick .card { display: flex; flex-direction: column; gap: 12px; width: min(100%, 300px); }
#nick label { font: 20px "Do Hyeon", "Apple SD Gothic Neo", sans-serif; color: var(--neon); text-shadow: 0 0 12px rgba(255, 79, 163, 0.7); text-align: center; letter-spacing: 0.04em; }
#nick input {
  font: 18px "Do Hyeon", "Apple SD Gothic Neo", sans-serif; color: var(--ink); text-align: center;
  background: rgba(20, 16, 30, 0.85); border: 1px solid rgba(255, 79, 163, 0.5); border-radius: 10px; padding: 12px;
  -webkit-user-select: text; user-select: text;
}
#nick input:focus { outline: none; border-color: var(--neon); box-shadow: 0 0 0 3px rgba(255, 79, 163, 0.2); }
#nick button { font: 17px "Do Hyeon", "Apple SD Gothic Neo", sans-serif; color: #08070c; background: var(--neon); border: 0; border-radius: 10px; padding: 11px; cursor: pointer; }
#nick button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
#mute[aria-pressed="true"] .on { display: none; }
#mute[aria-pressed="true"] .off { display: block; }
</style>
</head>
<body>

<canvas id="room" aria-label="비 오는 밤, 네온 간판 아래 재떨이와 담배 한 개비"></canvas>
<form id="nick" hidden>
  <div class="card">
    <label for="nickInput">닉네임</label>
    <input id="nickInput" maxlength="10" autocomplete="off" enterkeyhint="go">
    <button type="submit">들어가기</button>
  </div>
</form>
<button id="prevT" class="arrow left" aria-label="이전 테이블"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
<button id="nextT" class="arrow right" aria-label="다음 테이블"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
<div id="tableLabel" aria-live="polite"></div>
<form id="chat" hidden autocomplete="off">
  <input id="chatInput" maxlength="10" enterkeyhint="send" aria-label="한마디 (10글자)">
  <button type="submit" id="chatSend">보내기<i id="chatBar"></i></button>
</form>
<div id="queue" hidden aria-live="polite">
  <div class="card">
    <h2>자리가 다 찼어요</h2>
    <div class="rank" id="queueRank">대기 1번째</div>
    <p>자리가 나면 순서대로 바로 들어가요</p>
  </div>
</div>
<button id="micBtn" class="tool" hidden aria-label="마이크 켜기" aria-pressed="false">
  <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/><path d="M4 4l16 16"/></svg>
  <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
</button>
<button id="voiceBtn" class="tool" hidden aria-label="음성 소리 끄기" aria-pressed="false">
  <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/></svg>
  <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/><path d="M4 4l16 16"/></svg>
</button>
<button id="mute" aria-label="소리 끄기" aria-pressed="false">
  <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>
  <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>
</button>

<script>
(() => {
  const cv = document.getElementById("room"), ctx = cv.getContext("2d");
  const off = () => { const c = document.createElement("canvas"); return [c, c.getContext("2d")]; };
  const [bg, bgx] = off(), [sign, sgx] = off(), [puff, pfx] = off();
  const R = Math.random;
  const gauss = () => { let u = 0, v = 0; while (!u) u = R(); while (!v) v = R(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

  // soft smoke sprite
  puff.width = puff.height = 64;
  { const g = pfx.createRadialGradient(32, 32, 0, 32, 32, 32);
    g.addColorStop(0, "rgba(255,255,255,1)"); g.addColorStop(0.4, "rgba(255,255,255,0.55)"); g.addColorStop(1, "rgba(255,255,255,0)");
    pfx.fillStyle = g; pfx.fillRect(0, 0, 64, 64); }

  // ---------- layout ----------
  // Seats around the one shared ashtray, as angles on its rim. You always sit front-left;
  // everyone else in the room takes the next free seat.
  const SEATS = [Math.PI * 0.9, Math.PI * 0.1, Math.PI * 1.28, Math.PI * 1.72, Math.PI * 1.5, Math.PI * 0.55];
  const FILTER0 = -0.55, PAPER0 = -0.25, FULL = 0.78;
  let W, H, dpr, tableY, win, A, D, signY, signSize;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.clientWidth; H = cv.clientHeight;
    for (const c of [cv, bg]) { c.width = Math.round(W * dpr); c.height = Math.round(H * dpr); }
    tableY = H * 0.6;
    signY = Math.max(H * 0.085, 58);
    signSize = Math.min(W * 0.13, 70);
    const top = signY + signSize * 0.85;
    win = { x: W * 0.08, y: top, w: W * 0.84, h: tableY - top - H * 0.04 };
    const rx = Math.min(W * 0.3, 180, (H - tableY) * 0.55);
    A = { cx: W * 0.5, cy: tableY + (H - tableY) * 0.42, rx, ry: rx * 0.33 };
    D = rx * 0.085;
    paintBg(); paintSign();
    drops = []; for (let i = 0; i < 90; i++) drops.push(newGlassDrop(true));
    for (const c of allCigs()) geo(c);
  }
  // place a cigarette on its seat: resting on the rim, tip pointing at the middle
  function geo(c) {
    const th = c.th, dx = -Math.cos(th), dy = -Math.sin(th) * A.ry / A.rx;
    c.k = Math.hypot(dx, dy); c.ang = Math.atan2(dy, dx); c.cs = Math.cos(c.ang); c.sn = Math.sin(c.ang);
    c.rest = { x: A.cx + Math.cos(th) * A.rx * 0.9, y: A.cy + Math.sin(th) * A.ry * 0.9 - D * 0.55 };
  }
  // where a cigarette is right now: resting on the rim, or lifted (yours to your lips at the bottom of the
  // screen, other people's up toward where they sit), blended by c.lift.
  // Yours goes in two beats: your hand reaches in and takes it (first 30% of lift), then brings it up.
  const GRIP = FILTER0 + 0.16;
  const smooth = (x) => { x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); };
  const lerpAng = (a, b, t) => { let d = b - a; d = Math.atan2(Math.sin(d), Math.cos(d)); return a + d * t; };
  function computePose(c) {
    const rest = { x: c.rest.x, y: c.rest.y, ang: c.ang, k: c.k, s: 1 };
    const t = smooth(c.lift);
    let m;
    if (c.mine) {
      // seen from your own eyes: filter at your lips just below the screen, the rest pointing
      // away from you, so it looks short, a little tilted, and thick at the near end
      const sc = 2.1, ang = -1.78, k = 0.52;
      const fx = W * 0.47, fy = H + D * sc * 0.6;
      m = { ang, k, s: sc, x: fx - FILTER0 * A.rx * k * sc * Math.cos(ang), y: fy - FILTER0 * A.rx * k * sc * Math.sin(ang) };
    } else {
      const ox = Math.cos(c.th), oy = Math.sin(c.th);
      const fx = A.cx + ox * A.rx * 1.5, fy = A.cy + oy * A.ry * 1.5 - A.rx * 0.6;
      const ang = Math.atan2(-0.55, -ox * 0.9 || 0.01);
      m = { ang, k: 1, s: 1, x: fx - FILTER0 * A.rx * Math.cos(ang), y: fy - FILTER0 * A.rx * Math.sin(ang) };
    }
    const lerp = (a, b) => a + (b - a) * t;
    c.pose = t < 0.001 ? rest : { x: lerp(rest.x, m.x), y: lerp(rest.y, m.y) - Math.sin(Math.PI * t) * A.rx * 0.3,
               ang: lerpAng(rest.ang, m.ang, t), k: lerp(rest.k, m.k), s: lerp(1, m.s) };
    if (c.mine) {
      if (c.lift <= 0.001) { c.hand = null; return; }
      const g = P(c, GRIP);
      const held = { x: g.x, y: g.y, ang: c.pose.ang, s: 0.85 + (c.pose.s - 1) / 1.1 * 0.35 };
      if (c.lift >= 0.3) c.hand = held;
      else {
        const h = smooth(c.lift / 0.3), away = { x: W * 0.8, y: H + D * 26, ang: -1.5, s: 1.2 };
        c.hand = { x: away.x + (held.x - away.x) * h, y: away.y + (held.y - away.y) * h, ang: lerpAng(away.ang, held.ang, h), s: away.s + (held.s - away.s) * h };
      }
    }
  }

  // ---------- your hand ----------
  // a right hand seen from behind: cigarette between index and middle finger, ring and little
  // finger curled, thumb tucked under. Drawn in a frame laid along the cigarette at the grip.
  function drawHand(c, layer) {
    const h = c.hand; if (!h) return;
    const F = D * 9;
    ctx.save();
    ctx.translate(h.x, h.y); ctx.rotate(h.ang); ctx.scale(h.s, h.s);
    // a dark silhouette against the room, only its edges catching the neon
    const fill = ctx.createLinearGradient(0, -F * 0.4, 0, F * 2);
    fill.addColorStop(0, "#1c1622"); fill.addColorStop(1, "#08060b");
    const finger = (x0, y0, x1, y1, w, bend) => {
      const mx = (x0 + x1) / 2 + bend * (y1 - y0), my = (y0 + y1) / 2 - bend * (x1 - x0);
      ctx.lineCap = "round";
      ctx.strokeStyle = "rgba(255,79,163,0.45)"; ctx.lineWidth = w + 1.6;
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.quadraticCurveTo(mx, my, x1, y1); ctx.stroke();
      ctx.strokeStyle = fill; ctx.lineWidth = w;
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.quadraticCurveTo(mx, my, x1, y1); ctx.stroke();
    };
    if (layer === "back") {
      ctx.fillStyle = fill; ctx.strokeStyle = "rgba(64,224,255,0.3)"; ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(-F * 0.1, F * 0.6);
      ctx.quadraticCurveTo(-F * 0.55, F * 0.6, -F * 0.85, F * 1.05);
      ctx.quadraticCurveTo(-F * 0.95, F * 1.35, -F * 0.8, F * 1.6);
      ctx.lineTo(-F * 0.55, F * 2.6);
      ctx.lineTo(F * 0.75, F * 2.4);
      ctx.quadraticCurveTo(F * 0.45, F * 1.4, F * 0.28, F * 1.0);
      ctx.quadraticCurveTo(F * 0.12, F * 0.62, -F * 0.1, F * 0.6);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      finger(F * 0.3, F * 1.15, F * 0.18, F * 0.42, D * 2.4, 0.12);
      finger(-F * 0.45, F * 0.82, F * 0.02, -F * 0.42, D * 2.2, -0.08);
    } else {
      finger(-F * 0.18, F * 0.75, F * 0.28, -F * 0.36, D * 2.1, -0.08);
    }
    ctx.restore();
  }

  const P = (c, u) => { const q = c.pose || { x: c.rest.x, y: c.rest.y, ang: c.ang, k: c.k, s: 1 }, l = u * A.rx * q.k * q.s;
    return { x: q.x + l * Math.cos(q.ang), y: q.y + l * Math.sin(q.ang) }; };

  // ---------- static room ----------
  function paintBg() {
    const c = bgx, r = rng(3);
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    // wall
    const wall = c.createLinearGradient(0, 0, 0, tableY);
    wall.addColorStop(0, "#0d0a14"); wall.addColorStop(1, "#130f1c");
    c.fillStyle = wall; c.fillRect(0, 0, W, tableY);
    // window: out-of-focus city at night
    c.save();
    c.beginPath(); c.rect(win.x, win.y, win.w, win.h); c.clip();
    const sky = c.createLinearGradient(0, win.y, 0, win.y + win.h);
    sky.addColorStop(0, "#0a0b22"); sky.addColorStop(0.55, "#1b1035"); sky.addColorStop(1, "#2a1230");
    c.fillStyle = sky; c.fillRect(win.x, win.y, win.w, win.h);
    // big soft glows of billboards behind the rain
    for (const [col, fx, fy, fr] of [["255,60,160", 0.2, 0.55, 0.5], ["40,220,255", 0.78, 0.45, 0.45], ["255,170,60", 0.55, 0.85, 0.35], ["130,80,255", 0.4, 0.3, 0.4]]) {
      const x = win.x + win.w * fx, y = win.y + win.h * fy, rad = win.w * fr;
      const g = c.createRadialGradient(x, y, 0, x, y, rad);
      g.addColorStop(0, `rgba(${col},0.28)`); g.addColorStop(1, `rgba(${col},0)`);
      c.fillStyle = g; c.fillRect(win.x, win.y, win.w, win.h);
    }
    // blurry building masses
    for (let i = 0; i < 9; i++) {
      const bw = win.w * (0.08 + r() * 0.16), bx = win.x + r() * win.w - bw / 2, bh = win.h * (0.3 + r() * 0.6);
      const g = c.createLinearGradient(0, win.y + win.h - bh, 0, win.y + win.h);
      g.addColorStop(0, "rgba(6,6,16,0)"); g.addColorStop(0.15, "rgba(6,6,16,0.55)"); g.addColorStop(1, "rgba(6,6,16,0.85)");
      c.fillStyle = g; c.fillRect(bx, win.y + win.h - bh, bw, bh);
    }
    // bokeh: city lights out of focus
    const cols = ["255,79,163", "64,224,255", "255,190,90", "170,120,255", "255,255,255"];
    for (let i = 0; i < 70; i++) {
      const x = win.x + r() * win.w, y = win.y + win.h * (0.2 + r() * 0.8), rad = 3 + r() * win.w * 0.045;
      const col = cols[(r() * cols.length) | 0], a = 0.08 + r() * 0.25;
      const g = c.createRadialGradient(x, y, rad * 0.2, x, y, rad);
      g.addColorStop(0, `rgba(${col},${a})`); g.addColorStop(0.85, `rgba(${col},${a * 0.6})`); g.addColorStop(1, `rgba(${col},0)`);
      c.fillStyle = g; c.beginPath(); c.arc(x, y, rad, 0, Math.PI * 2); c.fill();
    }
    // glass haze
    c.fillStyle = "rgba(120,110,160,0.06)"; c.fillRect(win.x, win.y, win.w, win.h);
    c.restore();
    // frame and mullion
    c.strokeStyle = "#05040a"; c.lineWidth = 10; c.strokeRect(win.x, win.y, win.w, win.h);
    c.lineWidth = 6; c.beginPath(); c.moveTo(win.x + win.w / 2, win.y); c.lineTo(win.x + win.w / 2, win.y + win.h); c.stroke();

  function stepSmoke(dt) {

  // ---------- rain on the glass ----------

  // ---------- cigarette ----------
  function drawCigarette(c) {
    const q = c.pose, d = D, L = A.rx * q.k;

  }
  function startExhale(c, amount) {
    exhales.push({ c, t: 0, amount });
    sfx.at(c.mine ? 1 : 0.5, () => sfx.exhale(amount));
  }

  function stepCig(c, dt) {
    if (c.mine) {
      if (c.lit) {
        c.burnU -= (FULL - PAPER0) / 360 * (c.drag && c.lift > 0.85 ? 5 : 1) * dt;

    const target = c.lit ? (drawing ? 1 : 0.33 + 0.07 * Math.sin(clock * 2.3 + c.th * 5) + 0.04 * Math.sin(clock * 7.1 + c.th)) : 0;

  // ---------- the room: everyone who has this page open right now ----------
  // nicknames: typed by each person, kept in their browser, shared through presence
  const NICK_KEY = "cyber-smoke-nick";
  const cleanNick = (v) => typeof v === "string" ? v.replace(/[\u0000-\u001f\u007f-\u009f\u200b-\u200f\u202a-\u202e\u2066-\u2069]/g, "").trim().slice(0, 10) : "";

  function openNick() { nickInput.value = myNick; nickForm.hidden = false; setTimeout(() => nickInput.focus(), 50); }
  nickForm.addEventListener("submit", (e) => {
    e.preventDefault();
    const v = cleanNick(nickInput.value);
    if (!v) { nickInput.focus(); return; }
    myNick = v; nickForm.hidden = true; nickInput.blur();
    refresh();

  // ---------- the room, over Firebase Realtime Database ----------
  // lobby/<key>   : who is here and where they sit (table, since, waiting line, nickname) — everyone reads it
  // seats/<t>/<key>: the cigarette state of everyone at table t — only that table listens
  // <key> is "<anonymous uid>_<tab id>", so each tab is its own person and can only write its own rows.
  let clockOffset = 0;
  const now = () => Date.now() + clockOffset;
  async function makeFirebaseRoom(cfg) {
    if (!cfg || !window.firebase) return null;
    firebase.initializeApp(cfg);
    if (cfg.emulator) { firebase.auth().useEmulator("http://127.0.0.1:9099"); firebase.database().useEmulator("127.0.0.1", 9000); }
    await firebase.auth().signInAnonymously();
    const uid = firebase.auth().currentUser.uid;
    const key = uid + "_" + Math.random().toString(36).slice(2, 8);
    const db = firebase.database();
    db.ref(".info/serverTimeOffset").on("value", (s) => { clockOffset = s.val() || 0; });
    const LOBBY = ["tb", "since", "q", "qs", "nick"];
    const peersFns = [], connFns = [];
    let lobby = {}, seats = {}, seatTb = -1, seatRef = null, seatsRef = null;
    let mine = {}, lastLobby = "", lastSeat = {};
    const lobbyRef = db.ref("lobby/" + key);
    function emit() {
      const peers = [{ peer: key, isMe: true, sameTab: true, kind: "viewer", presence: mine }];
      for (const k in lobby) {
        if (k === key) continue;
        const l = lobby[k] || {};
        const extra = seatTb >= 0 && l.tb === seatTb && seats[k] ? seats[k] : {};
        peers.push({ peer: k, isMe: false, sameTab: false, kind: "viewer", presence: { ...extra, ...l } });
      }
      for (const f of peersFns) f({ peers });
    }
    function moveSeat(tb) {
      if (seatRef) { seatRef.onDisconnect().cancel(); seatRef.remove(); }
      if (seatsRef) seatsRef.off();
      seats = {}; seatTb = tb; seatRef = null; seatsRef = null; lastSeat = {};
      if (tb >= 0) {
        seatRef = db.ref(`seats/${tb}/${key}`);
        seatRef.onDisconnect().remove();
        seatsRef = db.ref(`seats/${tb}`);
        seatsRef.on("value", (s) => { seats = s.val() || {}; emit(); });
      }
    }
    function write(pr) {
      const l = {};
      for (const f of LOBBY) if (pr[f] !== undefined) l[f] = pr[f];
      const ls = JSON.stringify(l);
      if (ls !== lastLobby) { lastLobby = ls; lobbyRef.set(l).catch(() => {}); }
      const tb = Number.isInteger(pr.tb) ? pr.tb : -1;
      if (tb !== seatTb) moveSeat(tb);
      if (seatRef) {
        const upd = {}; let n = 0;
        for (const f in pr) if (!LOBBY.includes(f) && lastSeat[f] !== pr[f]) { upd[f] = pr[f]; n++; }
        if (n) { lastSeat = { ...lastSeat, ...upd }; seatRef.update(upd).catch(() => {}); }
      }
    }
    lobbyRef.onDisconnect().remove();
    db.ref("lobby").on("value", (s) => { lobby = s.val() || {}; emit(); });
    db.ref(".info/connected").on("value", (s) => {
      const on = !!s.val();
      if (on) {
        // after a dropped connection the server has already removed our rows: write them again
        lobbyRef.onDisconnect().remove();
        lastLobby = ""; lastSeat = {};
        const tb = seatTb; seatTb = -2; if (tb >= 0 || tb === -1) write(mine);
      }
      for (const f of connFns) f(on);
    });
    return {
      presence(pr) { mine = pr; write(pr); return Promise.resolve(); },
      onPeers(fn) { peersFns.push(fn); setTimeout(emit, 0); return () => {}; },
      onConnection(fn) { connFns.push(fn); return () => {}; },
      db, key
    };
  }
  // ---------- voice: everyone at your table, browser to browser ----------
  // Each pair at a table opens one WebRTC audio link; the one with the smaller key calls.
  // Offers, answers and network candidates travel through rtc/<table>/<to>/<msg> in the database.

    if (myNick && me.rest) { const lp = labelPos(me); if (Math.abs(e.clientX - lp.x) < 50 && e.clientY > lp.y - 10 && e.clientY < lp.y + 26) { openNick(); return; } }
    pressing = true; pressT = clock;
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  });
  const release = () => {
    if (!pressing) return;
    pressing = false;
    if (me.drag) {
      me.drag = false; sfx.inhale(false); sfx.burn(false);
      if (dragT > 0.25) { exAmt = Math.min(1, dragT / 2.5); exSeq++; startExhale(me, exAmt); }
      return;
    }
    if (me.lit && me.lift < 0.1) { me.jiggle = 0.3; if (me.ashU - me.burnU > 0.015) dropAsh(me); sfx.tap(); }
    else if (!me.lighter && !me.finished && me.alpha >= 1) { lightSeq++; startLighter(me); }
  };
  cv.addEventListener("pointerup", release);
  cv.addEventListener("pointercancel", release);
  window.addEventListener("resize", resize);

  // ---------- boot ----------
  resize();
  if (document.fonts && document.fonts.load) document.fonts.load(`${Math.round(signSize)}px "Do Hyeon"`).then(paintSign).catch(() => {});
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    step(dt); draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame((t) => { last = t; frame(t); });
})();
</script>
</body>
</html>
