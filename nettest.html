<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>외부 전송 시험</title>
<style>
:root{--bg:#f7f4ee;--panel:#fff;--text:#2a241c;--dim:#7a6e5d;--ok:#2f7d3b;--bad:#b23b30;--wait:#8a6d1f;--border:#e2dacb}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#100d0a;--panel:#1a1510;--text:#e6d8b8;--dim:#9a8a6e;--ok:#7fbf6a;--bad:#e0766b;--wait:#d6b65a;--border:#3a2e1f}}
:root[data-theme="dark"]{--bg:#100d0a;--panel:#1a1510;--text:#e6d8b8;--dim:#9a8a6e;--ok:#7fbf6a;--bad:#e0766b;--wait:#d6b65a;--border:#3a2e1f}
body{background:var(--bg);color:var(--text);font-family:system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;margin:0;line-height:1.55}
main{max-width:560px;margin:0 auto;padding:20px 16px}
h1{font-size:20px;margin:0 0 4px}
p{margin:6px 0}
.dim{color:var(--dim);font-size:13px}
ul{list-style:none;padding:0;margin:14px 0}
li{background:var(--panel);border:1px solid var(--border);padding:10px 12px;margin-bottom:8px;display:grid;grid-template-columns:1fr auto;gap:4px 10px}
li b{font-size:14px}
li .st{font-weight:700;font-size:13px;white-space:nowrap}
li .why{grid-column:1 / 3;font-size:12px;color:var(--dim);word-break:break-all}
.ok{color:var(--ok)}.bad{color:var(--bad)}.wait{color:var(--wait)}
#verdict{background:var(--panel);border:2px solid var(--border);padding:12px;font-weight:600}
#csp{font-size:12px;color:var(--dim);word-break:break-all}
</style>
</head><body><main>
  <h1>외부 전송 시험</h1>
  <p class="dim">이 페이지가 claude.ai 밖의 주소로 데이터를 보낼 수 있는지 시험한다. 실제 기록은 보내지 않고, 시험용 빈 요청만 보낸다. 열면 저절로 시험한다(몇 초).</p>
  <ul id="list"></ul>
  <p id="verdict">시험 중…</p>
  <p id="csp"></p>
</main>
<script>
const list = document.getElementById("list");
const blocked = [];
document.addEventListener("securitypolicyviolation", (e) => {
  blocked.push(`${e.effectiveDirective} ← ${e.blockedURI}`);
  document.getElementById("csp").textContent = "보안 정책이 막은 요청: " + blocked.join(" | ");
});
function row(name, desc) {
  const li = document.createElement("li");
  li.innerHTML = `<b></b><span class="st wait">시험 중</span><span class="why"></span>`;
  li.querySelector("b").textContent = name;
  li.querySelector(".why").textContent = desc;
  list.appendChild(li);
  return (ok, why) => {
    const st = li.querySelector(".st");
    st.className = "st " + (ok ? "ok" : "bad");
    st.textContent = ok ? "✓ 나감" : "✗ 막힘";
    li.querySelector(".why").textContent = desc + " — " + why;
    return ok;
  };
}
const timeout = (ms) => new Promise((_, rej) => setTimeout(() => rej(new Error("시간 초과")), ms));
async function tryFetch(name, desc, url, opts) {
  const done = row(name, desc);
  try {
    const r = await Promise.race([fetch(url, opts), timeout(8000)]);
    return done(true, r.type === "opaque" ? "요청이 나갔다(응답은 못 읽음, no-cors)" : `응답 ${r.status}`);
  } catch (e) {
    return done(false, String(e && e.message || e));
  }
}
function tryImage(name, desc, url) {
  const done = row(name, desc);
  return new Promise((res) => {
    const img = new Image();
    const t = setTimeout(() => res(done(false, "시간 초과")), 8000);
    img.onload = () => { clearTimeout(t); res(done(true, "이미지 요청이 나갔다")); };
    img.onerror = () => { clearTimeout(t); res(done(false, "이미지 요청 실패(막혔거나 주소 오류)")); };
    img.src = url + (url.includes("?") ? "&" : "?") + "t=" + Date.now();
  });
}
(async () => {
  const r = {};
  r.form = await tryFetch("구글 설문지 제출 주소", "docs.google.com 으로 POST(no-cors) — 실제 수집에 쓸 방식", "https://docs.google.com/forms/d/e/TEST/formResponse", { method: "POST", mode: "no-cors", body: new URLSearchParams({ "entry.1": "test" }) });
  r.cors = await tryFetch("일반 외부 API", "api.github.com 으로 GET(cors) — 응답까지 읽을 수 있는지", "https://api.github.com/zen", {});
  r.cdn = await tryFetch("허용된 CDN 주소", "cdnjs.cloudflare.com 으로 GET — 스크립트용으로 허용된 곳", "https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js", {});
  const beacon = row("sendBeacon", "docs.google.com 으로 sendBeacon — 페이지를 닫을 때 쓰는 방식");
  try {
    const q = navigator.sendBeacon("https://docs.google.com/forms/d/e/TEST/formResponse", new URLSearchParams({ "entry.1": "test" }));
    r.beacon = beacon(q, q ? "브라우저가 전송 대기열에 넣음(정책에 막히면 아래 보안 정책 줄에 뜬다)" : "브라우저가 거절");
  } catch (e) { r.beacon = beacon(false, String(e.message || e)); }
  r.img = await tryImage("이미지 요청", "www.google.com 이미지 — 이미지로 데이터를 실어 보내는 방식", "https://www.google.com/favicon.ico");
  await new Promise((s) => setTimeout(s, 600));
  const any = r.form || r.cors || r.img || (r.beacon && !blocked.some((b) => b.includes("docs.google")));
  const v = document.getElementById("verdict");
  if (r.form && !blocked.some((b) => b.includes("docs.google"))) { v.textContent = "결론: 구글 설문지로 자동 전송 가능 ✓"; v.className = "ok"; }
  else if (any) { v.textContent = "결론: 설문지 POST는 막혔지만 다른 방식(위 ✓ 항목)은 나간다 — 그 방식으로 우회 가능"; v.className = "wait"; }
  else { v.textContent = "결론: 외부 전송이 모두 막혀 있다 ✗"; v.className = "bad"; }
})();
</script>
</body></html>
